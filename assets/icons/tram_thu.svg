<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <clipPath id="wclip"><rect x="60" y="820" width="904" height="170" rx="85"/></clipPath>
    <linearGradient id="beamL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe36b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe36b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe36b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe36b" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tower"><path d="M372 890 L642 890 L604 420 L420 420 Z"/></clipPath>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.18"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6a8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffd54a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset="1" stop-color="#ffc928"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd8ff"/>
      <stop offset="1" stop-color="#2f9be0"/>
    </linearGradient>
  </defs>

  <!-- glow and light beams -->
  <circle cx="512" cy="340" r="190" fill="url(#glow)"/>
  <path d="M470 330 L40 250 L40 400 Z" fill="url(#beamL)"/>
  <path d="M554 330 L984 250 L984 400 Z" fill="#ffe36b" opacity="0.38"/>

  <!-- water -->
  <g clip-path="url(#wclip)"><path d="M40 880 Q150 835 240 880 T420 880 T600 880 T780 880 T964 880 L984 960 Q874 1000 784 960 T604 960 T424 960 T244 960 T40 960 Z" fill="url(#water)"/></g>

  <!-- rocks -->
  <path d="M290 900 Q300 840 380 830 L650 830 Q730 840 745 900 Q640 935 512 935 Q390 935 290 900 Z" fill="#7a6a5c" stroke="#4d4137" stroke-width="8" stroke-linejoin="round"/>
  <path d="M340 870 Q380 850 430 868" fill="none" stroke="#a79584" stroke-width="10" stroke-linecap="round"/>

  <!-- tower body: red and white bands -->
  <g clip-path="url(#tower)">
    <rect x="340" y="400" width="340" height="500" fill="#ffffff"/>
    <rect x="340" y="420" width="340" height="95" fill="#d92b2b"/>
    <rect x="340" y="610" width="340" height="95" fill="#d92b2b"/>
    <rect x="340" y="800" width="340" height="100" fill="#d92b2b"/>
    <rect x="340" y="400" width="340" height="500" fill="url(#shade)"/>
  </g>
  <path d="M372 890 L642 890 L604 420 L420 420 Z" fill="none" stroke="#5b1414" stroke-width="8" stroke-linejoin="round"/>

  <!-- door and window -->
  <path d="M480 890 L480 815 Q512 780 544 815 L544 890 Z" fill="#5a3a22" stroke="#3a2414" stroke-width="6"/>
  <rect x="496" y="650" width="32" height="46" rx="16" fill="#2b4a6b" stroke="#16263a" stroke-width="5"/>
  <rect x="498" y="470" width="28" height="40" rx="14" fill="#2b4a6b" stroke="#16263a" stroke-width="5"/>

  <!-- gallery -->
  <rect x="385" y="392" width="254" height="30" rx="8" fill="#37424f" stroke="#1d242c" stroke-width="6"/>
  <g stroke="#37424f" stroke-width="6">
    <line x1="410" y1="392" x2="410" y2="360"/>
    <line x1="460" y1="392" x2="460" y2="360"/>
    <line x1="564" y1="392" x2="564" y2="360"/>
    <line x1="614" y1="392" x2="614" y2="360"/>
  </g>
  <line x1="405" y1="360" x2="619" y2="360" stroke="#37424f" stroke-width="8" stroke-linecap="round"/>

  <!-- lamp room -->
  <rect x="440" y="285" width="144" height="107" rx="10" fill="url(#lamp)" stroke="#37424f" stroke-width="8"/>
  <line x1="488" y1="285" x2="488" y2="392" stroke="#37424f" stroke-width="7"/>
  <line x1="536" y1="285" x2="536" y2="392" stroke="#37424f" stroke-width="7"/>

  <!-- roof -->
  <path d="M420 290 Q512 150 604 290 Z" fill="#d92b2b" stroke="#5b1414" stroke-width="8" stroke-linejoin="round"/>
  <rect x="504" y="140" width="16" height="40" rx="8" fill="#37424f"/>
  <circle cx="512" cy="132" r="16" fill="#37424f"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
