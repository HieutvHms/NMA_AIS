name: ais
description: "AIS AtoN - Mobile Application"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  #  State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  #  Dependency Injection
  get_it: ^8.0.2
  #  Networking
  dio: ^5.7.0
  injectable:
    ^2.5.0
    #  Router
  go_router: ^14.6.2

  #  Local Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  #  Environment
  flutter_dotenv: ^5.2.1
  flutter_svg: ^2.3.0

  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.14.4"
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_hms.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_hms.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/device/
    - assets/icons/sign_in/
    - assets/icons/navbar/
    - assets/icons/setting/
    - assets/icons/member/
